android.useAndroidX=true

# Robolectric downloads its Android SDK test runtime at test execution time.
# Use Maven Central's canonical endpoint instead of repo1.maven.org, which
# intermittently fails with connection errors on GitHub-hosted runners.
systemProp.robolectric.dependency.repo.url=https://repo.maven.apache.org/maven2

# CI verification: Robolectric artifact mirror configured above.
