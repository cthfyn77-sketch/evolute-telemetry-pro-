name: Android unit tests (no APK)

on:
  push:
    branches:
      - mcp-restore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Gradle unit tests only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests only
        run: gradle --no-daemon testDebugUnitTest
